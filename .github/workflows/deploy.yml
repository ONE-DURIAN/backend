name: Build and Push Docker Image (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      # ใช้เฉพาะ Actions ที่สร้างโดย GitHub (actions/*) เท่านั้น เพื่อให้ผ่านข้อกำหนดความปลอดภัยของ Organization
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Swag CLI & Generate Docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/api/main.go -o docs

      - name: Verify Go Build
        run: |
          go build -v ./cmd/api

      # ใช้คำสั่ง Docker CLI พื้นฐานที่มีอยู่ใน Ubuntu Runner โดยตรง (ไม่ต้องพึ่ง Third-party Actions)
      - name: Build and Push Docker Image
        run: |
          # 1. Login to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 2. เตรียมชื่อ Image (บังคับให้เป็นตัวพิมพ์เล็กเสมอ)
          IMAGE_NAME="ghcr.io/one-durian/backend"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "🚀 Building Docker image: $IMAGE_NAME:latest and $IMAGE_NAME:sha-$SHORT_SHA"

          # 3. Build Docker Image
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:sha-$SHORT_SHA" \
            .

          # 4. Push to GHCR
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$SHORT_SHA"

          echo "✅ Successfully pushed Docker image to GHCR!"
