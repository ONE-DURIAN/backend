services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      # เปิดพอร์ตในวงแลนเพื่อให้ทดสอบยิงจากเครื่อง MacBook ในบ้านได้
      - "${APP_PORT}:8080"
    networks:
      - app_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: community_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - app_net

networks:
  app_net:
    driver: bridge